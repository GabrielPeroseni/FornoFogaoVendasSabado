<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Forno &amp; Fogão – Gestão</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Alegreya:wght@400;700&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#fffaf1;--sf:#ffffff;--tx:#3a2312;--mu:#8a6a4f;--ac:#d8402e;--or:#f08a1c;--dk:#5c3317;--yl:#fff1c9;--bd:#f3e6cc;--sb:#fff1d6;--st:#5c3317;--ok:#2b7a3d}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1e1510;--sf:#2b1f17;--tx:#f7ead8;--mu:#c4a98c;--ac:#ff6a55;--yl:#4a3418;--bd:#4a3626;--sb:#140d09;--st:#fde9a0;--ok:#6fcf86}}
:root[data-theme="dark"]{--bg:#1e1510;--sf:#2b1f17;--tx:#f7ead8;--mu:#c4a98c;--ac:#ff6a55;--yl:#4a3418;--bd:#4a3626;--sb:#140d09;--st:#fde9a0;--ok:#6fcf86}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.45 Alegreya,Georgia,serif}
h1,h2,h3,.bn{font-family:"Bebas Neue",Impact,sans-serif;font-weight:400;letter-spacing:.04em}h2{font-size:30px;margin:0 0 10px;color:var(--ac)}h3{font-size:26px;margin:0 0 6px;color:var(--or)}
.app{display:grid;grid-template-columns:148px 1fr;min-height:100vh}aside{background:var(--sb);color:var(--st);padding:12px 6px;border-right:1px solid var(--bd);display:flex;flex-direction:column;flex:1;min-height:0;overflow-y:auto}
aside img{width:82px;display:block;margin:0 auto 9px}aside button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--st);font-family:Georgia,"Times New Roman",serif;font-size:14.3px;text-transform:uppercase;padding:8px 9px;border-radius:8px;cursor:pointer}
aside button.on{background:var(--or);color:#3a1a05;font-weight:700}aside .sub button{padding-left:14px;font-size:12.5px}aside button{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
main{padding:16px 18px;max-width:none;min-width:0;width:100%}.hb{display:none}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
.hero{background:linear-gradient(135deg,var(--or),var(--ac));color:#fff;border-radius:14px;padding:18px;display:flex;gap:16px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.hero img{width:120px}.hero h1{font-size:40px;margin:0;line-height:1}.hero p{margin:4px 0}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{background:var(--yl);color:var(--dk);border-radius:99px;padding:5px 14px;font-weight:700;font-size:17px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.it{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dashed var(--bd);padding:6px 0}.it small{display:block;color:var(--mu);font-size:13px}.it b{white-space:nowrap}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.row>label{flex:1;min-width:130px;font-size:13px;color:var(--mu);display:flex;flex-direction:column;gap:3px}
input,select{font:inherit;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);width:100%}
.b{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:9px 16px;font:inherit;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block}
.g{background:var(--yl);color:var(--dk);border:0;border-radius:8px;padding:6px 10px;font:inherit;cursor:pointer}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--bd)}td:first-child,.r,th{white-space:nowrap}th{font-size:14px;color:var(--mu);text-transform:uppercase}tr.sel td{background:var(--yl)}
.r{text-align:right}.tot{font-size:20px;font-weight:700;text-align:right;margin-top:8px}.pill{background:var(--yl);color:var(--dk);border-radius:99px;padding:2px 10px;font-size:15px;font-weight:700;white-space:nowrap}.ab{background:#ffe08a;color:#5e4200}.co{background:#bfe8c8;color:#14532d}.ca{background:#ffc9c2;color:#8a1c10}.al{background:var(--yl);color:var(--dk)}.fb{border:2px solid transparent;border-radius:99px;padding:6px 14px;font:inherit;font-weight:700;cursor:pointer}.fb.on{border-color:var(--dk);box-shadow:0 0 0 2px var(--sf) inset}select.st{font-weight:700}.dg{background:#2e9d4f;color:#fff}.dy{background:#f2c230;color:#3a2a00}.dr{background:#d8402e;color:#fff}.dn{background:#d9cdb8;color:#3a2312}.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}.dc{border:3px solid transparent;border-radius:12px;padding:12px;font:inherit;text-align:left;cursor:pointer}.dc.on{border-color:var(--dk);box-shadow:0 0 0 3px var(--yl)}.dc b{display:block;font-size:40px;line-height:1.1;font-family:"Bebas Neue",Impact,sans-serif;font-weight:400}.dc span{font-size:15px}.big{border-radius:16px;padding:20px;text-align:center}.big b{display:block;font-family:"Bebas Neue",Impact,sans-serif;font-weight:400;font-size:130px;line-height:1}.big span{font-size:22px;letter-spacing:.08em}.alrt{border-radius:10px;padding:10px 14px;margin-bottom:10px;font-weight:700;font-size:18px}.bar{height:14px;border-radius:99px;background:var(--bd);overflow:hidden}.bar i{display:block;height:100%}.nm{display:block;font-size:26px;color:var(--tx)}.app>div:first-child{display:flex;flex-direction:column}.out{margin-top:auto;border-top:1px solid var(--bd);border-radius:0}.mod{position:fixed;inset:0;background:rgba(40,20,10,.55);display:grid;place-items:center;z-index:50}.mod .card{min-width:300px;text-align:center;margin:0}#rmap{position:relative;height:clamp(360px,calc(100vh - 380px),560px);overflow:hidden;border-radius:10px;background:#e9e2d3}.tl{position:absolute;width:256px;height:256px;max-width:none}.pin{position:absolute;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;border:3px solid #5c3317;box-shadow:0 1px 4px rgba(0,0,0,.5);cursor:pointer}.pin.lj{background:#d8402e;width:26px;height:26px;margin:-13px 0 0 -13px}.pin::after{content:attr(data-n);position:absolute;bottom:26px;left:50%;transform:translateX(-50%);background:#3a2312;color:#fff;padding:4px 8px;border-radius:6px;white-space:nowrap;font-size:14px;display:none}.pin:hover{z-index:5}.pin:hover::after{display:block}@media(min-width:821px){.app>div:first-child{position:sticky;top:0;height:100vh;align-self:start}}
.warn{color:var(--ac);font-size:14px}.ok{color:var(--ok);font-weight:700}.sug{border:1px solid var(--bd);border-radius:8px;background:var(--sf);margin-top:4px}.sug div{padding:7px 10px;cursor:pointer}.sug div:hover{background:var(--yl)}
iframe{width:100%;height:380px;border:0;border-radius:10px;background:var(--yl)}.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:14px;align-items:start}.split>div{min-width:0}@media(min-width:821px){.split>div{max-height:calc(100vh - 210px);min-height:480px;overflow-y:auto;padding-right:4px}}
.login{max-width:380px;margin:8vh auto;text-align:center;padding:0 14px}.login img{width:150px}.login h1{color:var(--ac);font-size:34px;margin:6px 0}.login input{margin:6px 0}
@media(max-width:820px){.app{grid-template-columns:1fr}.hb{display:block;background:var(--sb);color:var(--st);border:0;width:100%;padding:12px;font:inherit;font-size:18px;text-align:left}aside{display:none}aside.open{display:block}.split{grid-template-columns:1fr}}
#syn{position:fixed;right:10px;bottom:8px;z-index:60;background:var(--sf);border:1px solid var(--bd);border-radius:999px;padding:3px 10px;font-size:12px;color:var(--mu);cursor:pointer;opacity:.9}#syn.err{color:#fff;background:#d8402e;border-color:#d8402e}@media print{#syn{display:none}}</style></head><body><div id="root"></div>

function login(msg){const acc=ls.g("ff_acc");$("#root").innerHTML=`<div class="login card"><img src="${LOGO}" alt="Forno e Fogão"><h1>FORNO &amp; FOGÃO</h1><p style="color:var(--mu)">${acc?"Entre com sua conta":"Primeiro acesso: crie sua conta"}</p>
<input id="lu" placeholder="Usuário" autocomplete="username"><input id="lp" type="password" placeholder="Senha" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()"><div class="warn">${msg||""}</div><button class="b" style="width:100%" onclick="doLogin()">${acc?"Entrar":"Criar conta e entrar"}</button></div>`}
async function doLogin(){const u=$("#lu").value.trim(),p=$("#lp").value;if(!u||p.length<4)return login("Informe usuário e senha (mín. 4 caracteres).");const h=await hsh(p),a=ls.g("ff_acc");
if(!a)ls.s("ff_acc",JSON.stringify({u,h}));else{const o=JSON.parse(a);if(o.u!==u||o.h!==h)return login("Usuário ou senha incorretos.")}ls.s("ff_ses",u);ses=u;V="ini";render()}
function logout(){QX=true;render()}
function doOut(){ls.d("ff_ses");ses=null;login()}

${MENU.map(([k,l])=>`<button class="${V===k||(SUBS[k]||[]).some(x=>x[0]===V)?"on":""}" onclick="go('${k}')">${l}</button>${(SUBS[k]||[]).some(x=>x[0]===V)?`<div class="sub">${SUBS[k].map(([s,t])=>`<button class="${V===s?"on":""}" onclick="go('${s}')">${t}</button>`).join("")}</div>`:""}`).join("")}
<button class="out" onclick="logout()">⎋ Sair (${esc(ses)})</button></aside></div><main>${{ini:vIni,prod:vProd,end:vEnd,est:vEst,disp:vDisp,rota:vRota,ped:()=>vList("ped"),avu:()=>vList("avu"),del:()=>vList("del")}[V]()}</main></div>${QX?`<div class="mod"><div class="card"><h3>SAIR</h3><p>Deseja realmente sair?</p><div class="row" style="justify-content:center"><button class="b" onclick="QX=false;doOut()">Sim, sair</button><button class="g" onclick="QX=false;render()">Cancelar</button></div></div></div>`:""}`}

function delProd(id){if(S.ped.some(o=>o.itens.some(i=>i.pid===id)))return alert("Produto usado em pedidos; não pode excluir.");if(confirm("Excluir produto?")){S.prod=S.prod.filter(p=>p.id!==id);render()}}
function nid(a,pre){return pre+String(a.reduce((m,x)=>Math.max(m,+String(x.id).replace(/\D/g,"")),0)+1).padStart(4,"0")}

<div class="card"><input placeholder="Buscar endereço…" value="${esc(window.qe||"")}" oninput="window.qe=this.value;clearTimeout(window.t);window.t=setTimeout(()=>{render();const i=document.querySelector('.card input[placeholder^=Buscar]');i.focus();i.setSelectionRange(99,99)},300)"></div>
<div class="card tw"><table><tr><th>Endereço<th>Faixa<th>Bairro<th class="r">Taxa<th></tr>${S.end.map((x,i)=>[x,i]).filter(([x])=>norm(x.nome+" "+(x.faixa||"")+" "+(x.bairro||"")).includes(q)).map(([x,i])=>`<tr><td>${esc(x.nome)}<td>${esc(x.faixa||"")}<td>${esc(x.bairro||"")}<td class="r">${R(x.taxa)}<td><button class="g" onclick="editE=S.end[${i}];render()">Editar</button> <button class="g" onclick="if(confirm('Excluir?')){S.end.splice(${i},1);render()}">Excluir</button>`).join("")}</table></div>`}

/* VENDAS */
const TT={ped:"PEDIDOS",avu:"AVULSOS",del:"DELIVERY"};
function parseEtq(c){c=(c||"").replace(/\D/g,"");return c.length!==13?null:{cod:+c.slice(1,6),val:+c.slice(7,12)/100}}

const sub=o=>o.itens.reduce((s,i)=>s+itemVal(i),0),total=o=>sub(o)+(o.tipo==="del"?+o.taxa||0:0),cnt=(h,id)=>S.ped.filter(o=>o.tipo==="del"&&o.hora===h&&o.st!=="CANCELADO"&&o.id!==id).length;
const addr=o=>`${o.end}, ${o.num}, Salto, SP`;

return`<h2>${TT[t]}</h2>${t==="del"?`<div class="card"><div class="chips">${SL.map(h=>`<span class="chip">${h} · ${cnt(h)}/${MAX}</span>`).join("")}</div></div>`:""}
<div class="split"><div><div class="card"><div class="row"><button class="b" onclick="newPed('${t}')">+ Nova comanda</button><div class="chips">${[["TODAS","Todas","al"],["ABERTO","Abertos","ab"],["CONCLUÍDO","Concluídos","co"],["CANCELADO","Cancelados","ca"]].map(([k,l,c])=>`<button class="fb ${c}${FL===k?" on":""}" onclick="FL='${k}';render()">${l} (${k==="TODAS"?A.length:A.filter(o=>o.st===k).length})</button>`).join("")}</div></div></div>
<div class="card tw"><table><tr><th>Nº<th>Cliente<th>${t==="del"?"Entrega<th>Endereço":"Hora"}<th>Status<th class="r">Total<th></tr>${L.map(x=>`<tr class="${cur&&cur.id===x.id?"sel":""}" style="cursor:pointer" onclick="cur=JSON.parse(JSON.stringify(S.ped.find(z=>z.id==='${x.id}')));render()"><td>${x.id}<td>${esc(x.cli)}${x.extra?' <span class="pill">EXTRA</span>':""}<td>${x.hora}${t==="del"?`<td>${esc(x.end)}, ${esc(x.num)}`:""}<td><span class="pill ${stc(x.st)}">${x.st}</span><td class="r">${R(total(x))}<td><button class="g" title="Imprimir" onclick="event.stopPropagation();printCom('${x.id}')">🖨</button> <button class="g" onclick="event.stopPropagation();if(confirm('Excluir?')){S.ped=S.ped.filter(z=>z.id!=='${x.id}');if(cur&&cur.id==='${x.id}')cur=null;render()}">✕</button>`).join("")||'<tr><td colspan="7">Nenhuma comanda ainda.</td></tr>'}</table></div></div>
<div>${cur&&cur.tipo===t?vForm():'<div class="card" style="color:var(--mu)">Clique em uma comanda da lista ou crie uma nova.</div>'}</div></div>`}
function newPed(t){cur={id:onid(t),tipo:t,cli:t==="avu"?"Avulso":"",tel:"",hora:t==="avu"?new Date().toTimeString().slice(0,5):t==="del"?SL[0]:HP[3],st:"ABERTO",itens:[],end:"",num:"",comp:"",pag:"",taxa:0,extra:false};render()}
const vMap=o=>o.end&&o.num?`<div class="card"><h3>Localização</h3><p>${esc(addr(o))}${o.comp?" – "+esc(o.comp):""}</p><iframe loading="lazy" src="https://maps.google.com/maps?q=${encodeURIComponent(addr(o))}&output=embed"></iframe><p><button class="g" onclick="render2()">↻ Atualizar mapa</button> <a class="b" target="_blank" href="https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(STORE)}&destination=${encodeURIComponent(addr(o))}">🧭 Rota no Google Maps</a></p></div>`:'<div class="card" style="color:var(--mu)">Informe endereço e número para ver no mapa.</div>';
function vForm(){const o=cur,t=o.tipo;
return`<div class="card"><h3>COMANDA ${o.id} · ${TT[t]}</h3><div class="row"><label>Cliente<input value="${esc(o.cli)}" style="text-transform:uppercase" oninput="const s=this.selectionStart;this.value=this.value.toUpperCase();this.setSelectionRange(s,s);cur.cli=this.value"></label>
${t==="del"?`<label>Telefone<input value="${esc(o.tel)}" oninput="cur.tel=this.value"></label>`:""}
${t==="ped"?`<label>Horário de retirada<select onchange="cur.hora=this.value">${(HP.includes(o.hora)?HP:[o.hora,...HP]).map(h=>`<option ${o.hora===h?"selected":""}>${h}`).join("")}</select></label>`:""}
${t==="del"?`<label>Horário de entrega<select onchange="cur.hora=this.value;render2()">${SL.map(h=>`<option ${o.hora===h?"selected":""} value="${h}">${h} (${cnt(h,o.id)}/${MAX}${cnt(h,o.id)>=MAX?" lotado":""})`).join("")}</select></label>`:""}
<label>Status<select class="st ${stc(o.st)}" onchange="cur.st=this.value;render2()">${STS.map(s=>`<option ${o.st===s?"selected":""}>${s}`).join("")}</select></label>
<label>Pagamento<select onchange="cur.pag=this.value"><option value=""${o.pag?"":" selected"}></option>${PAG.map(s=>`<option ${o.pag===s?"selected":""}>${s}`).join("")}</select></label></div>
${t==="del"&&cnt(o.hora,o.id)>=MAX?`<p class="warn">Horário lotado (${MAX}/${MAX}). <label><input type="checkbox" style="width:auto" ${o.extra?"checked":""} onchange="cur.extra=this.checked"> Permitir entrega EXTRA neste horário</label></p>`:""}</div>
${t==="del"?`<div class="card"><div class="row"><label style="flex:3">Endereço (digite 3 letras)<input id="endi" value="${esc(o.end)}" autocomplete="off" oninput="cur.end=this.value;sug(this.value)"><div id="sug"></div></label><label>Nº da casa<input value="${esc(o.num)}" oninput="cur.num=this.value"></label><label>Complemento<input value="${esc(o.comp)}" oninput="cur.comp=this.value"></label><label>Taxa (R$)<input id="tx" type="number" step="0.5" value="${o.taxa}" oninput="cur.taxa=this.value"></label></div></div>`:""}
<div class="card"><div class="chips" style="margin-bottom:10px">${["ASSADOS","ACOMPANHAMENTOS","BEBIDAS","ESPECIAIS"].map(c=>`<button class="fb al${AC===c?" on":""}" onclick="AC='${c}';render2()">${c}</button>`).join("")}</div><div class="row"><label style="flex:2">Produto (${AC})<select id="addp"><option value="">Selecione…</option>${S.prod.filter(p=>p.cat===AC&&p.ativo!=="NÃO").map(p=>`<option value="${p.id}"${esgot(p)?" disabled":""}>${esc(p.nome)}`).join("")}</select></label><label>Qtd<input id="addq" type="number" min="1" step="1" value="1"></label><button class="b" onclick="addIt()">Adicionar</button></div><div style="color:var(--mu);font-size:14px">Itens em KG: a quantidade é a pedida pelo cliente; a leitura da etiqueta (bipe abaixo) informa só o preço.</div></div>

<div class="card tw"><table><tr><th>Produto<th>Un.<th>Qtd<th>Etiqueta<th class="r">Valor<th></tr>${o.itens.map((i,n)=>{const p=pid(i.pid);return`<tr><td>${esc(p.nome)}<td>${p.un}<td><input type="number" min="1" step="1" style="width:80px" value="${i.qtd}" onchange="cur.itens[${n}].qtd=Math.max(1,Math.floor(+this.value)||1);render2()"><td>${p.un==="KG"?`<input style="width:150px" value="${i.etq||""}" placeholder="13 dígitos" onchange="setEtq(${n},this.value)">`:"—"}<td class="r">${p.un==="KG"&&!i.etq?'<span class="warn">aguardando etiqueta</span>':R(itemVal(i))}<td><button class="g" onclick="cur.itens.splice(${n},1);render2()">✕</button>`}).join("")||'<tr><td colspan="6">Sem itens.</td></tr>'}</table>
<div class="r">Itens: ${R(sub(o))}${t==="del"?` · Taxa: ${R(o.taxa)}`:""}</div><div class="tot">Total: ${R(total(o))}</div></div>
<div class="row" style="margin-bottom:14px"><button class="b" onclick="savePed()">Salvar comanda</button><button class="b" style="background:var(--dk)" onclick="printCom()">🖨 Imprimir</button><button class="g" onclick="cur=null;render()">Fechar</button></div>${t==="del"?vMap(o):""}`}
function sug(v){const d=$("#sug");if(norm(v).length<3){d.innerHTML="";return}const m=S.end.map((e,i)=>[e,i]).filter(([e])=>norm(e.nome+" "+(e.bairro||"")).includes(norm(v))).slice(0,15);
d.className=m.length?"sug":"";d.innerHTML=m.map(([e,i])=>`<div onclick="pick(${i})">${esc(e.nome)}${e.faixa?" ("+esc(e.faixa)+")":""}${e.bairro?" · "+esc(e.bairro):""} · ${R(e.taxa)}</div>`).join("")}
function pick(i){const e=S.end[i];cur.end=e.nome;cur.taxa=e.taxa;cur.bairro=e.bairro||"";$("#endi").value=e.nome;$("#tx").value=e.taxa;$("#sug").innerHTML="";$("#sug").className=""}
function render2(){const y=scrollY;render();scrollTo(0,y)}
const esgot=p=>(+S.est[p.id]||0)-resv(p.id)<=0;
function addIt(){const id=$("#addp").value,q=Math.floor(+$("#addq").value);if(!id)return;if(!(q>=1))return alert("Quantidade mínima 1.");const p=pid(id),e=cur.itens.find(i=>i.pid===id);if(p.ativo==="NÃO")return alert("Produto inativo: não pode ser adicionado ao pedido.");if(esgot(p))return alert("Produto sem disponibilidade (0): não pode ser adicionado a nenhuma comanda.");if(p.un==="UND"&&e)e.qtd=+e.qtd+q;else cur.itens.push({pid:id,qtd:q,etq:""});render2()}
function setEtq(n,v){const i=cur.itens[n],p=pid(i.pid),e=parseEtq(v);if(!v){i.etq="";return render2()}if(!e)return alert("Etiqueta inválida (13 dígitos).");if(e.cod!==+p.cod)return alert("Etiqueta de outro produto (código "+e.cod+").");i.etq=v.replace(/\D/g,"");render2()}
function scan(el){const v=el.value,e=parseEtq(v);el.value="";const m=$("#msg");if(!e){m.textContent="Etiqueta inválida.";return}const p=S.prod.find(x=>x.un==="KG"&&+x.cod===e.cod);if(!p){m.textContent="Código "+e.cod+" não cadastrado.";return}
const it=cur.itens.find(i=>i.pid===p.id&&!i.etq);if(!it){m.textContent="Nenhum "+p.nome+" aguardando etiqueta.";return}it.etq=v.replace(/\D/g,"");render2();$("#scan").focus();$("#msg").innerHTML='<span class="ok">✔ '+esc(p.nome)+" = "+R(e.val)+"</span>"}
function savePed(){const o=cur;if(!o.cli.trim())return alert("Informe o cliente.");if(!o.itens.length)return alert("Adicione itens.");
if(o.tipo==="del"){if(!o.end||!o.num)return alert("Informe endereço e número.");if(o.st!=="CANCELADO"&&cnt(o.hora,o.id)>=MAX&&!o.extra)return alert("Horário lotado. Marque entrega EXTRA ou troque o horário.")}
o.cli=o.cli.trim().toUpperCase();const k=S.ped.findIndex(x=>x.id===o.id);k<0?S.ped.push(o):S.ped[k]=o;cur=JSON.parse(JSON.stringify(o));render()}
/* ESTOQUE */
function vEst(){const rs=id=>S.ped.filter(o=>o.st!=="CANCELADO").reduce((s,o)=>s+o.itens.filter(i=>i.pid===id).reduce((a,i)=>a+(+i.qtd||0),0),0);
return`<h2>ESTOQUE</h2><div class="card">Informe a quantidade produzida. Disponível = Produzida − Reservada (comandas não canceladas).</div><div class="card tw"><table><tr><th>Produto<th>Un.<th>Produzida<th>Reservada<th class="r">Disponível</tr>${S.prod.map(p=>{const d=(+S.est[p.id]||0)-rs(p.id);return`<tr><td>${esc(p.nome)}<td>${p.un}<td><input type="number" step="0.1" style="width:90px" value="${S.est[p.id]??""}" onchange="S.est['${p.id}']=this.value;render2()"><td>${nf(rs(p.id))}<td class="r" style="font-weight:700;${d<0?"color:var(--ac)":""}">${nf(d)}`}).join("")}</table></div>`}
let RS="TODOS",RT=0,QX=false,RG=false;
const gmap=L=>L.length?`<iframe src="https://maps.google.com/maps?saddr=${encodeURIComponent(STORE)}&daddr=${L.map(o=>encodeURIComponent(addr(o))).join("+to:")}&output=embed" style="height:clamp(360px,calc(100vh - 380px),560px)"></iframe><small style="color:var(--mu)">Rota da loja (A) passando pelas entregas do horário, na ordem da lista.</small>`:"<p>Nenhuma entrega neste horário.</p>";
const MX=(g,z)=>(g+180)/360*2**z*256,MY=(t,z)=>(1-Math.log(Math.tan(t*Math.PI/180)+1/Math.cos(t*Math.PI/180))/Math.PI)/2*2**z*256;
const rl=()=>S.ped.filter(o=>o.tipo==="del"&&o.st!=="CANCELADO"&&(RS==="TODOS"||o.hora===RS)).sort((a,b)=>a.hora.localeCompare(b.hora));
function openD(id){V="del";FL="TODAS";cur=JSON.parse(JSON.stringify(S.ped.find(o=>o.id===id)));render()}
const TP=[(z,x,y)=>`https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/${z}/${y}/${x}`,(z,x,y)=>`https://tile.openstreetmap.org/${z}/${x}/${y}.png`];

async function geo(q){const G=S.geo||(S.geo={});if(q in G)return G[q];try{const r=await fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&q="+encodeURIComponent(q)),j=await r.json();G[q]=j[0]?{lat:+j[0].lat,lng:+j[0].lon}:null;save();return G[q]}catch(e){return undefined}}
function vRota(){const L=rl(),all=S.ped.filter(o=>o.tipo==="del"&&o.st!=="CANCELADO");setTimeout(drawMap,0);
return`<h2>ROTA DE ENTREGAS</h2><div class="card"><div class="chips">${["TODOS",...SL].map(h=>`<button class="fb al${RS===h?" on":""}" onclick="RS='${h}';render()">${h} (${h==="TODOS"?all.length:all.filter(o=>o.hora===h).length})</button>`).join("")}</div></div>
<div class="split"><div class="card"><h3>Entregas (${L.length})</h3>${L.map(o=>`<div class="it" style="cursor:pointer" onclick="openD('${o.id}')"><span><b>${o.id}</b> · ${esc(o.cli)}<small>${o.hora} · ${esc(o.end)}, ${esc(o.num)}${o.comp?" – "+esc(o.comp):""}</small></span><span class="pill ${stc(o.st)}">${o.st}</span></div>`).join("")||"Nenhuma entrega neste horário."}
${L.length?`<p><a class="b" target="_blank" href="https://www.google.com/maps/dir/${[STORE,...L.map(addr)].map(encodeURIComponent).join("/")}">🧭 Abrir rota no Google Maps</a></p>`:""}</div>
<div class="card"><div class="row" style="margin-bottom:10px"><button class="g" onclick="RG=!RG;render()">${RG?"📍 Ver pontos dos pedidos":"🗺 Ver mapa do Google"}</button></div>${RG?gmap(L):`<div id="rmap"></div><div id="rst" class="warn"></div><small style="color:var(--mu)">Mapa: Esri e colaboradores do OpenStreetMap</small>`}</div></div>`}
async function drawMap(){const t=++RT,el=$("#rmap"),st=$("#rst");if(!el)return;const L=rl(),P=[],ok=()=>t===RT&&$("#rmap")===el,fail=()=>{st.textContent="Não foi possível localizar os endereços neste ambiente (sem acesso ao serviço de mapas). Use o botão “Abrir rota no Google Maps”."};
st.textContent="Localizando endereços…";const H=await geo(STORE+", Brasil");if(!ok())return;if(H===undefined)return fail();
for(const o of L){let g=await geo(addr(o)+", Brasil");if(g===null)g=await geo(o.end+", Salto, SP, Brasil");if(!ok())return;if(g===undefined)return fail();if(g)P.push({o,...g})}
const c=[...P,...(H?[H]:[])];if(!c.length)c.push({lat:-23.2,lng:-47.29});const W=el.clientWidth||600,Hh=el.clientHeight||480,la=c.map(p=>p.lat),ln=c.map(p=>p.lng);let z=17;
while(z>11&&(MX(Math.max(...ln),z)-MX(Math.min(...ln),z)>W-100||MY(Math.min(...la),z)-MY(Math.max(...la),z)>Hh-100))z--;
const L0=(MX(Math.max(...ln),z)+MX(Math.min(...ln),z))/2-W/2,T0=(MY(Math.min(...la),z)+MY(Math.max(...la),z))/2-Hh/2;let h="";
for(let x=Math.floor(L0/256);x<=Math.floor((L0+W)/256);x++)for(let y=Math.floor(T0/256);y<=Math.floor((T0+Hh)/256);y++)h+=`<img class="tl" alt="" data-k="0" data-t="${z},${x},${y}" onerror="tf(this)" src="${TP[0](z,x,y)}" style="left:${x*256-L0}px;top:${y*256-T0}px">`;
const pin=(p,cl,n,k)=>`<div class="pin ${cl}" data-n="${n}" style="left:${MX(p.lng,z)-L0}px;top:${MY(p.lat,z)-T0}px"${k?` onclick="${k}"`:""}></div>`;
h+=P.map(p=>pin(p,stc(p.o.st),`${p.o.id} · ${esc(p.o.cli)} · ${p.o.hora}`,`openD('${p.o.id}')`)).join("")+(H?pin(H,"lj","🔥 Forno & Fogão",""):"");
el.innerHTML=h;st.textContent=P.length+" de "+L.length+" entrega(s) localizada(s) no mapa."}
let DC="ASSADOS",DP=null,AC="ASSADOS";
const kgq=(v,p)=>+p.preco>0?Math.round(v/p.preco*1000)/1000:0;
const resv=id=>S.ped.filter(o=>o.st!=="CANCELADO").reduce((s,o)=>s+o.itens.filter(i=>i.pid===id).reduce((a,i)=>a+(+i.qtd||0),0),0),nf=n=>String(Math.round(n*1000)/1000).replace(".",",");
function dinfo(p){const pr=+S.est[p.id]||0,r=resv(p.id),pc=pr>0?r/pr*100:(r>0?999:null);return{pr,r,d:pr-r,pc,c:pc===null?"dn":pc>90?"dr":pc>80?"dy":"dg"}}
const amsg=i=>(i.c==="dr"?"🚨 ALERTA: ":"⚠ ATENÇÃO: ")+(i.pc>=999?"encomendado sem estoque informado":i.pc.toFixed(1).replace(".",",")+"% encomendado")+(i.c==="dr"?" (acima de 90%)":" (entre 81% e 90%)");
function vDisp(){const L=S.prod.filter(p=>p.cat===DC&&p.ativo!=="NÃO"),al=L.map(p=>[p,dinfo(p)]).filter(([,z])=>z.c==="dy"||z.c==="dr"),sp=DP&&pid(DP),i=sp&&dinfo(sp);
return`<h2>DISPONIBILIDADE</h2><div class="card"><div class="chips">${["ASSADOS","ACOMPANHAMENTOS","ESPECIAIS"].map(c=>`<button class="fb al${DC===c?" on":""}" onclick="DC='${c}';DP=null;render()">${c}</button>`).join("")}</div></div>
${al.map(([p,x])=>`<div class="alrt ${x.c}">${esc(p.nome)}: ${amsg(x)}</div>`).join("")}
<div class="split"><div class="card"><div class="dgrid">${L.map(p=>{const x=dinfo(p);return`<button class="dc ${x.c}${DP===p.id?" on":""}" onclick="DP='${p.id}';render()"><span>${esc(p.nome)}</span><b>${nf(x.d)}</b></button>`}).join("")||"Nenhum produto ativo nesta categoria."}</div></div>
<div>${sp?`<div class="card"><h3>${esc(sp.nome)}</h3><div class="big ${i.c}"><span>DISPONÍVEL (${sp.un})</span><b>${nf(i.d)}</b></div>${i.c==="dy"||i.c==="dr"?`<div class="alrt ${i.c}" style="margin-top:12px">${amsg(i)}</div>`:""}
<div class="row" style="margin:14px 0"><label>Produzido<b class="nm">${nf(i.pr)}</b></label><label>Encomendado<b class="nm">${nf(i.r)}</b></label><label>% encomendado<b class="nm">${i.pc===null||i.pc>=999?"—":i.pc.toFixed(1).replace(".",",")+"%"}</b></label></div><div class="bar"><i class="${i.c}" style="width:${Math.min(i.pc??0,100)}%"></i></div></div>`:'<div class="card" style="color:var(--mu)">Clique em um produto para ver a disponibilidade.</div>'}</div></div>`}

/* SINCRONIZAÇÃO – GOOGLE PLANILHAS (Apps Script) */
const RC=(()=>{try{return JSON.parse(ls.g("ff_api")||"null")}catch(e){return null}})();
let RSNAP={},RREV=null,RTM=null,RBUSY=false,RDIRTY=false;
const rj=x=>JSON.stringify(x);
function setSt(t,err){let d=document.getElementById("syn");if(!d){d=document.createElement("div");d.id="syn";d.onclick=()=>connScreen(RC?"Para trocar a conexão, informe os novos dados.":"");document.body.appendChild(d)}d.textContent=t;d.className=err?"err":""}
async function rcall(b){const q=b.action==="all"||b.action==="rev";const u=q?RC.url+(RC.url.includes("?")?"&":"?")+"k="+encodeURIComponent(RC.key)+"&action="+b.action:RC.url;
 const r=await fetch(u,q?{}:{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:rj({...b,k:RC.key})});const j=await r.json();if(!j.ok)throw new Error(j.err||"erro");return j}
function snapNow(){return{prod:rj(S.prod),est:rj(S.est),end:rj(S.end),ped:Object.fromEntries(S.ped.map(o=>[o.id,rj(o)]))}}
function pend(){if(!RC)return;RDIRTY=true;clearTimeout(RTM);RTM=setTimeout(rpush,800)}
async function rpush(){if(!RC)return;if(RBUSY){pend();return}const n=snapNow(),o=RSNAP.ped||{},b={action:"sync"};let any=false;
 if(n.prod!==RSNAP.prod){b.prod=S.prod;any=true}if(n.est!==RSNAP.est){b.est=S.est;any=true}if(n.end!==RSNAP.end){b.end=S.end;any=true}
 const up=S.ped.filter(x=>n.ped[x.id]!==o[x.id]),del=Object.keys(o).filter(id=>!(id in n.ped));if(up.length||del.length){b.ped={up,del};any=true}
 if(!any){RDIRTY=false;return}RBUSY=true;setSt("⟳ Salvando…");
 try{const j=await rcall(b);RSNAP=n;RREV=j.rev;RDIRTY=false;setSt("☁ Salvo")}catch(e){setSt("⚠ Não salvou ("+e.message+"). Tentando de novo…",1);clearTimeout(RTM);RTM=setTimeout(rpush,15000)}finally{RBUSY=false}}
function normS(){S.ped.forEach(o=>{o.cli=String(o.cli||"").toUpperCase();o.itens=o.itens||[]});S.prod.forEach(p=>{p.desc=""})}
async function rload(first){const j=await rcall({action:"all"});RREV=j.rev;
 if(!j.prod.length&&!j.ped.length&&!j.end.length&&first){RSNAP={};RDIRTY=true;await rpush();return}
 if(j.prod.length)S.prod=j.prod;S.ped=j.ped;S.est=j.est||{};if(j.end.length)S.end=j.end;S.endv=3;normS();RSNAP=snapNow();RDIRTY=false;ls.s(KEY,JSON.stringify(S))}
setInterval(async()=>{if(!RC||RBUSY||RDIRTY||cur||editP||editE||document.hidden||!ses)return;try{const j=await rcall({action:"rev"});if(j.rev!==RREV){await rload(false);render();setSt("☁ Atualizado")}}catch(e){}},20000);
function connScreen(msg){$("#root").innerHTML=`<div class="login card"><img src="${LOGO}" alt="Forno e Fogão"><h1>BANCO DE DADOS</h1><p style="color:var(--mu)">Cole o endereço do app da planilha e a chave de acesso.</p>
<input id="cu" placeholder="Endereço (https://script.google.com/macros/s/…/exec)" value="${esc(RC?RC.url:"")}"><input id="ck" type="password" placeholder="Chave de acesso"><div class="warn">${esc(msg||"")}</div>
<button class="b" style="width:100%" onclick="connSave()">Conectar</button><button class="g" style="width:100%;margin-top:8px" onclick="${ses?"render()":"ls.s('ff_local','1');boot()"}">${ses?"Voltar":"Usar só neste computador"}</button></div>`}
async function connSave(){const u=$("#cu").value.trim(),k=$("#ck").value;if(!u||!k)return connScreen("Informe o endereço e a chave.");
 try{const r=await fetch(u+(u.includes("?")?"&":"?")+"k="+encodeURIComponent(k)+"&action=rev"),j=await r.json();if(!j.ok)throw new Error(j.err)}catch(e){return connScreen("Não conectou: "+e.message)}
 ls.s("ff_api",JSON.stringify({url:u,key:k}));ls.d("ff_local");location.reload()}
async function boot(){if(!RC&&!ls.g("ff_local"))return connScreen("");
 if(RC){setSt("⟳ Conectando…");try{await rload(true);setSt("☁ Conectado")}catch(e){setSt("⚠ Sem conexão: "+e.message,1)}}
 ses=ls.g("ff_ses");ses?render():login()}
boot();
